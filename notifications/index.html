function select(id){current=id;group=items.find(x=>x.id===id).group;render()}
function showToast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(window.timer);window.timer=setTimeout(()=>$('toast').hidden=true,2000)}
function list(){const t=selected();if(t.id==='R04'){$('list-label').textContent='登录受限入口';$('center').innerHTML=status+nav('登录','centerback')+'<div class="login"><h2>当前账号无法登录</h2><p>您的账号已被限制登录。</p><button class="primary" id="loginresult">查看处理结果</button></div>';$('centerback').onclick=()=>select('R01');$('loginresult').onclick=()=>showToast('右侧为身份验证后的处理结果');return}
$('list-label').textContent='消息中心';let body='';if(active==='official'){body=items.filter(x=>x.group===group).map(x=>{const row=x.id===t.id?t:x;return '<button class="notice" data-message="'+x.id+'"><h3>'+esc(row.title)+'</h3><p>'+esc(row.body)+'</p><div class="notice-foot"><time>2026-10-20</time><span>查看详情<i class="tinychev"></i></span></div></button>'}).join('')+'<div class="bottom">没有更多了～</div>'}else{body=(filter==='全部消息'||filter==='评论'?'<div class="interaction"><span class="avatar">小</span><div><h3>小黑同学</h3><small>评论了您　18分钟前</small><p>这个记账方法很实用！</p><div class="quote">这个月的省钱记录</div></div></div>':'')+(filter==='全部消息'||filter==='点赞与收藏'?'<div class="interaction"><span class="avatar">记</span><div><h3>记账同学</h3><small>赞了您　06-18</small><div class="quote" style="margin-top:10px">这个月的省钱记录</div></div></div>':'')+(filter==='全部消息'||filter==='关注'?'<div class="interaction"><span class="avatar">小</span><div><h3>小黑同学</h3><small>开始关注了您　05-09</small></div></div>':'')+'<div class="bottom">没有更多了～</div>'}
$('center').innerHTML=status+nav('消息中心','centerback')+'<div class="tabs"><button id="interaction" class="'+(active==='interaction'?'active':'')+'">互动消息<i class="down"></i></button><button id="official" class="'+(active==='official'?'active':'')+'">官方通知</button>'+(menu?'<div class="filtermenu">'+['全部消息','点赞与收藏','关注','评论'].map(x=>'<button data-filter="'+x+'" class="'+(filter===x?'active':'')+'">'+x+(filter===x?'<span>✓</span>':'')+'</button>').join('')+'</div>':'')+'</div><div class="list">'+body+'</div>';
$('centerback').onclick=()=>showToast('返回上一级');$('interaction').onclick=()=>{if(active==='interaction')menu=!menu;else{active='interaction';menu=false}list()};$('official').onclick=()=>{active='official';menu=false;list()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;menu=false;list()});document.querySelectorAll('[data-message]').forEach(b=>b.onclick=()=>select(b.dataset.message));}
function resultIcon(t){const good=['C03','N01'].includes(t.id);return '<div class="mark '+(good?'success':'')+'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(good?'<path d="m5 12 4.5 4.5L19 7"/>':'<path d="M12 5v9"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>')+'</svg></div>'}
function detail(){const t=selected();$('recipient-label').textContent='发送给：'+t.recipient;const report=['C03','C04','N01','N02'].includes(t.id),good=['C03','N01'].includes(t.id),risk=t.id.startsWith('R');const title=risk?'账号处理结果':t.title;const base=t.fields.filter(([k])=>k!=='处理结果'&&k!=='解除条件'),result=t.fields.find(([k])=>k==='处理结果')?.[1]||t.body;
$('detail').innerHTML=status+nav(title,'detailback')+'<div class="detailbody"><div class="result">'+resultIcon(t)+'<h2>'+esc(t.status)+'</h2></div><section class="detailcard"><h3>'+(report?'举报详情':risk?'限制详情':'审核详情')+'</h3><dl class="fields">'+base.map(([k,v])=>'<div class="field"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl></section><section class="detailcard"><h3>处理结果</h3><p class="resulttext">'+esc(result)+'</p></section><div class="time">2026-10-20 10:00</div><button class="feedback" id="feedback">如有疑问，联系小黑</button></div>';
$('detailback').onclick=()=>{active='official';list();showToast(t.id==='R04'?'返回登录页':'返回消息中心')};$('feedback').onclick=()=>dialog('意见反馈','接入 APP 现有意见反馈入口。','返回',()=>{});
$('modes').innerHTML=t.id.startsWith('P')?'审核结果<select id="branch" aria-label="审核处置"><option value="manual"'+(branch==='manual'?' selected':'')+'>人审处置</option><option value="machine"'+(branch==='machine'?' selected':'')+'>机审保留原资料</option></select>':['C02','C03'].includes(t.id)?'评论处置<select id="disposition" aria-label="评论处置"><option value="unlist"'+(!deleted?' selected':'')+'>下架</option><option value="delete"'+(deleted?' selected':'')+'>实际删除</option></select>':'';
if($('branch'))$('branch').onchange=e=>{branch=e.target.value;detail()};if($('disposition'))$('disposition').onchange=e=>{deleted=e.target.value==='delete';render()};}
function render(){const gs=[...new Set(items.map(x=>x.group))];$('groups').innerHTML=gs.map(g=>'<button data-group="'+g+'" aria-pressed="'+(g===group)+'">'+g+'</button>').join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{active='official';select(items.find(x=>x.group===b.dataset.group).id)});$('scenario').innerHTML=items.filter(x=>x.group===group).map(x=>'<option value="'+x.id+'"'+(current===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('');$('scenario').onchange=e=>select(e.target.value);list();detail();$('templates').innerHTML='<h2>推送内容模板</h2>'+items.filter(x=>x.group===group&&(group!=='资料审核'||x.id==='P01')).map(x=>'<section class="copyrow '+(x.id===current?'selected':'')+'"><div class="copyhead"><h3>'+esc(group==='资料审核'?'头像 / 名称 / 签名':x.name)+'</h3><button data-copy="'+x.id+'">复制</button></div><p>'+esc(x.title)+'\n'+esc(x.text)+'</p></section>').join('')+'<p class="sample">页面内容为演示示例</p>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=items.find(x=>x.id===b.dataset.copy);const text=t.title+'\n'+t.text;try{await navigator.clipboard.writeText(text);showToast('已复制')}catch{dialog('通知模板','<textarea readonly style="width:100%;min-height:100px">'+esc(text)+'</textarea>','关闭',()=>{})}});scale()}
let previousFocus;function dialog(title,body,button,callback){previousFocus=document.activeElement;$('dialog').innerHTML='<h2 id="dialogtitle">'+esc(title)+'</h2><p>'+body+'</p><button class="primary" id="dialogclose">'+esc(button)+'</button>';$('overlay').hidden=false;$('dialogclose').onclick=()=>{$('overlay').hidden=true;callback();previousFocus?.focus()};$('dialogclose').focus()}
$('overlay').onclick=e=>{if(e.target===$('overlay')){$('overlay').hidden=true;previousFocus?.focus()}};document.addEventListener('keydown',e=>{if(!$('overlay').hidden&&e.key==='Escape'){$('overlay').hidden=true;previousFocus?.focus()}});
function scale(){let s=Math.min(1,Math.max(.55,(innerHeight-190)/844));if(innerWidth<560)s=Math.min(1,(innerWidth-32)/390);else if(innerWidth<900)s=Math.min(s,(innerWidth-72)/780);document.documentElement.style.setProperty('--s',s)}window.addEventListener('resize',scale);render();
</script></body></html>
